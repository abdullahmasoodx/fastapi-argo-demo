apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-gitops-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi-gitops-demo
  template:
    metadata:
      labels:
        app: fastapi-gitops-demo
    spec:
      containers:
        - name: fastapi-gitops-demo
          image: abdullahmasoodx/fastapi-gitops-demo:v1
          ports:
           - containerPort: 5001
