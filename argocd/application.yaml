apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fastapi-demo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/abdullahmasoodx/fastapi-argo-demo.git
    targetRevision: main
    path: myapp-chart

    helm:
      releaseName: myapp-chart
      valueFiles:
       - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
     - CreateNamespace=true